<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TasteTrail | Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .detail-hero {
            position: relative;
            height: 400px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: 40px;
            background: #111;
        }
        .detail-hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .detail-header {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }
        .detail-header h1 {
            font-size: 48px;
            margin-bottom: 8px;
        }
        .detail-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 40px;
            padding-bottom: 60px;
        }
        .review-full-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 24px;
        }
        .review-full-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: var(--radius-lg);
        }
        .review-full-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Navigation -->
        <nav class="navbar">
            <a href="/" class="logo" style="text-decoration:none;">
                <i class="ph-fill ph-map-pin"></i>
                Taste<span>Trail</span>
            </a>
            <div class="nav-actions">
                <a href="/" class="btn btn-outline"><i class="ph ph-arrow-left"></i> Home</a>
            </div>
        </nav>

        <main class="main-content" id="detailContainer">
            <div class="loading" style="text-align:center; margin-top:100px;">Loading details...</div>
        </main>
    </div>

    <!-- Modals Overlay -->
    <div class="modal-overlay" id="modalOverlay">
        <!-- Add Review Modal -->
        <div class="modal" id="addReviewModal">
            <div class="modal-header">
                <h3>Leave a Review</h3>
                <button class="close-modal"><i class="ph ph-x"></i></button>
            </div>
            <form id="addReviewForm" class="form">
                <input type="hidden" id="reviewRestId">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="reviewUser" required placeholder="Guest">
                </div>
                <div class="form-group">
                    <label>Rating (1-5)</label>
                    <div class="star-rating-input">
                        <input type="range" id="reviewRating" min="1" max="5" step="1" value="5">
                        <span id="ratingDisplay">5 ⭐</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Comment</label>
                    <textarea id="reviewComment" rows="3" required placeholder="What did you order?"></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Post Review</button>
            </form>
        </div>
    </div>

    <script src="/js/restaurant.js"></script>
</body>
</html>
