<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TasteTrail | Your Food Journey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <!-- Phosphor Icons for modern sleek icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="app-container">
        <!-- Navigation -->
        <nav class="navbar">
            <div class="logo">
                <i class="ph-fill ph-map-pin"></i>
                Taste<span>Trail</span>
            </div>
            <div class="nav-actions">
                <button class="btn btn-outline" id="newJourneyBtn" disabled title="Coming soon in Phase 2"><i class="ph ph-path"></i> New Journey</button>
                <button class="btn btn-primary" id="addRestaurantBtn"><i class="ph ph-plus"></i> Add Spot</button>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="hero">
                <div class="hero-content">
                    <h1>Map Your <span class="text-gradient">Cravings</span></h1>
                    <p>Discover, review, and curate the best food spots in town.</p>
                </div>
            </header>

            <section class="section">
                <div class="section-header" style="flex-direction: column; align-items: stretch; gap: 16px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h2>Popular Spots</h2>
                        <div class="search-bar" style="display: flex; gap: 8px;">
                            <input type="text" id="searchInput" placeholder="Search by name..." style="min-width: 250px;">
                        </div>
                    </div>
                    <div class="filters-container" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 16px;">
                        <div class="filters cuisine-filters" id="cuisineFilters">
                            <button class="filter-chip active" data-cuisine="all">All</button>
                            <button class="filter-chip" data-cuisine="Japanese">Japanese</button>
                            <button class="filter-chip" data-cuisine="American">American</button>
                            <button class="filter-chip" data-cuisine="Italian">Italian</button>
                            <button class="filter-chip" data-cuisine="Mexican">Mexican</button>
                        </div>
                        <div class="filters price-filters" id="priceFilters">
                            <span style="font-size: 14px; color: var(--text-muted);">Price:</span>
                            <button class="filter-chip" data-price="$">$</button>
                            <button class="filter-chip active" data-price="any">Any</button>
                            <button class="filter-chip" data-price="$$">$$</button>
                            <button class="filter-chip" data-price="$$$">$$$</button>
                        </div>
                    </div>
                </div>

                <!-- Restaurants Grid -->
                <div class="restaurant-grid" id="restaurantGrid">
                    <!-- Cards will be populated by JS -->
                    <div class="loading">Loading spots...</div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modals Overlay -->
    <div class="modal-overlay" id="modalOverlay">
        
        <!-- Add Restaurant Modal -->
        <div class="modal" id="addRestaurantModal">
            <div class="modal-header">
                <h3>Add a New Spot</h3>
                <button class="close-modal"><i class="ph ph-x"></i></button>
            </div>
            <form id="addRestaurantForm" class="form">
                <div class="form-group">
                    <label>Restaurant Name</label>
                    <input type="text" id="restName" required placeholder="e.g. Burger Joint">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="restLocation" required placeholder="Neighborhood/City">
                    </div>
                    <div class="form-group">
                        <label>Cuisine</label>
                        <input type="text" id="restCuisine" required placeholder="e.g. American">
                    </div>
                </div>
                <div class="form-group">
                    <label>Image URL (optional)</label>
                    <input type="url" id="restImageUrl" placeholder="https://...">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Add Spot</button>
            </form>
        </div>

        <!-- Add Review Modal -->
        <div class="modal" id="addReviewModal">
            <div class="modal-header">
                <h3>Leave a Review</h3>
                <button class="close-modal"><i class="ph ph-x"></i></button>
            </div>
            <h4 id="reviewTargetName" class="review-target"></h4>
            <form id="addReviewForm" class="form">
                <input type="hidden" id="reviewRestId">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="reviewUser" required placeholder="Guest">
                </div>
                <div class="form-group">
                    <label>Rating (1-5)</label>
                    <div class="star-rating-input">
                        <input type="range" id="reviewRating" min="1" max="5" step="1" value="5">
                        <span id="ratingDisplay">5 ⭐</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Comment</label>
                    <textarea id="reviewComment" rows="3" required placeholder="What did you order?"></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Post Review</button>
            </form>
        </div>

    </div>

    <script src="/js/app.js"></script>
</body>
</html>
